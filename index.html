
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <!-- Three.js dựng Vũ Trụ 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #05010a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      color: #fff;
    }

    #spaceCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    .card-generator {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 35px 30px;
      max-width: 520px;
      width: 90%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 35px rgba(216, 27, 96, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.1);
      animation: floatCard 4s ease-in-out infinite alternate;
    }

    @keyframes floatCard {
      from { transform: translateY(0px); }
      to { transform: translateY(-10px); }
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      color: #ff80ab;
      text-align: center;
      font-size: 42px;
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(255, 128, 171, 0.8);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #ffd1dc;
      font-size: 14px;
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 12px 15px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 182, 193, 0.4);
      border-radius: 12px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: all 0.3s;
    }

    select option {
      background: #120324;
      color: #fff;
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: #ff4081;
      box-shadow: 0 0 12px rgba(255, 64, 129, 0.5);
    }

    textarea {
      height: 90px;
      resize: vertical;
    }

    .btn-create {
      width: 100%;
      background: linear-gradient(45deg, #d81b60, #ff4081, #7b1fa2);
      background-size: 200% 200%;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 0 20px rgba(216, 27, 96, 0.5);
      animation: gradientBtn 3s ease infinite;
    }

    @keyframes gradientBtn {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .btn-create:hover {
      transform: scale(1.03);
      box-shadow: 0 0 30px rgba(255, 64, 129, 0.8);
    }

    .result-box {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: none;
    }

    .result-url {
      word-break: break-all;
      font-size: 13px;
      color: #81d4fa;
      margin-bottom: 12px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.3);
      border-radius: 8px;
    }

    .btn-copy {
      background: #00c853;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-copy:hover {
      background: #00e676;
      box-shadow: 0 0 15px rgba(0, 200, 83, 0.6);
    }
  </style>
</head>
<body>

  <!-- Khung Canvas Vũ Trụ 3D -->
  <div id="spaceCanvas"></div>

  <div class="card-generator">
    <h1>✨ Tạo Thiệp Vũ Trụ 20/10 ✨</h1>
    
    <div class="form-group">
      <label for="recipientName">Tên người nhận (ví dụ: Mẹ yêu, Chị Lan, Linh...):</label>
      <input type="text" id="recipientName" placeholder="Nhập tên người nhận...">
    </div>

    <div class="form-group">
      <label for="sampleWishes">Chọn lời chúc mẫu:</label>
      <select id="sampleWishes" onchange="applyWish()">
        <option value="">-- Chọn lời chúc gợi ý --</option>
        <option value="Giữa dải ngân hà vô tận, em chính là ngôi sao dịu dàng và tỏa sáng nhất. Chúc em 20/10 thật hạnh phúc!">Dành cho Người yêu / Vợ</option>
        <option value="Cảm ơn Mẹ đã luôn là vầng thái dương ấm áp soi sáng cuộc đời con. Kính chúc Mẹ ngày 20/10 luôn an lành và nhiều sức khỏe!">Dành cho Mẹ</option>
        <option value="Chúc bạn ngày 20/10 luôn rạng rỡ, tự tin và vươn tới những thành công lấp lánh như các vì sao!">Dành cho Bạn bè / Đồng nghiệp</option>
      </select>
    </div>

    <div class="form-group">
      <label for="customMessage">Lời chúc riêng của bạn:</label>
      <textarea id="customMessage" placeholder="Nhập những tâm tư gửi gắm..."></textarea>
    </div>

    <button class="btn-create" onclick="generateLink()">Tạo Link</button>

    <div class="result-box" id="resultBox">
      <p style="font-weight: bold; color: #ff80ab; margin-bottom: 8px;">Link thiệp của bạn đã tạo xong:</p>
      <div class="result-url" id="linkOutput"></div>
      <button class="btn-copy" id="copyBtn" onclick="copyLink()">📋 Sao chép Link gửi qua Zalo/Mess</button>
    </div>
  </div>

  <script>
    // --- 1. DỰNG VŨ TRỤ 3D BẰNG THREE.JS ---
    const container = document.getElementById('spaceCanvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const count = 3500;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    for (let i = 0; i < count * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 16;
      positions[i + 1] = (Math.random() - 0.5) * 16;
      positions[i + 2] = (Math.random() - 0.5) * 16;

      colors[i] = Math.random() * 0.5 + 0.5;     // Red
      colors[i + 1] = Math.random() * 0.2 + 0.3; // Green
      colors[i + 2] = 0.9;                       // Blue
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.035,
      vertexColors: true,
      transparent: true,
      opacity: 0.85
    });

    const starParticles = new THREE.Points(geometry, material);
    scene.add(starParticles);

    function animate() {
      requestAnimationFrame(animate);
      starParticles.rotation.y += 0.001;
      starParticles.rotation.x += 0.0005;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 2. LOGIC TẠO & COPY LINK ---
    function applyWish() {
      const select = document.getElementById('sampleWishes');
      if (select.value) {
        document.getElementById('customMessage').value = select.value;
      }
    }

    function generateLink() {
      const name = document.getElementById('recipientName').value.trim();
      const msg = document.getElementById('customMessage').value.trim();

      if (!name) {
        alert("Vui lòng nhập tên người nhận!");
        return;
      }

      const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '') + 'thiep.html';
      const generatedUrl = `${baseUrl}?to=${encodeURIComponent(name)}&msg=${encodeURIComponent(msg)}`;

      document.getElementById('linkOutput').innerText = generatedUrl;
      document.getElementById('resultBox').style.display = 'block';
    }

    function copyLink() {
      const linkText = document.getElementById('linkOutput').innerText;
      navigator.clipboard.writeText(linkText).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = "✅ Đã sao chép link!";
        btn.style.background = "#2e7d32";
        setTimeout(() => {
          btn.innerText = "📋 Sao chép Link gửi qua Zalo/Mess";
          btn.style.background = "#00c853";
        }, 2000);
      });
    }
  </script>
</body>
</html>
